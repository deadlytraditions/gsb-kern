<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Content pages: section navigation, content, optional sidebar. Backend layout pagets__TwoColumns: Top (0), Main (1), Sidebar (3), Bottom (2).</f:comment>
<f:layout name="Default" />

<f:section name="Main">
    <f:render partial="Navigation/Breadcrumb" arguments="{breadcrumbMenu: breadcrumbMenu}" />
    <f:render partial="Banner" arguments="{media: media}" />
    <div class="kern-container gk-main">
        <div class="kern-row">
            <f:if condition="{menuSub}">
                <div class="kern-col-12 kern-col-lg-3">
                    <f:render partial="Navigation/Section" arguments="{menuSub: menuSub, breadcrumbMenu: breadcrumbMenu}" />
                </div>
            </f:if>
            <main id="main" class="kern-col-12 {f:if(condition: menuSub, then: 'kern-col-lg-9', else: 'kern-col-lg-12')}" tabindex="-1" aria-labelledby="page-title">
                <div class="kern-row">
                    <div class="kern-col-12 {f:if(condition: sidebar, then: 'kern-col-xl-8')} gk-content">
                        <f:render partial="PageTitle" arguments="{_all}" />
                        <!--TYPO3SEARCH_begin-->
                        <f:format.raw>{top}</f:format.raw>
                        <f:format.raw>{main}</f:format.raw>
                        <!--TYPO3SEARCH_end-->
                    </div>
                    <f:if condition="{sidebar}">
                        <aside class="kern-col-12 kern-col-xl-4 gk-sidebar">
                            <!--TYPO3SEARCH_begin-->
                            <f:format.raw>{sidebar}</f:format.raw>
                            <!--TYPO3SEARCH_end-->
                        </aside>
                    </f:if>
                </div>
            </main>
        </div>
    </div>
    <f:comment>Bottom column (e.g. teaser tiles "more on this topic") as a full-width band</f:comment>
    <f:if condition="{bottom}">
        <section class="gk-context" aria-label="{f:translate(key: 'context.label', extensionName: 'gsb_kern')}">
            <div class="kern-container">
                <!--TYPO3SEARCH_begin-->
                <f:format.raw>{bottom}</f:format.raw>
                <!--TYPO3SEARCH_end-->
            </div>
        </section>
    </f:if>
</f:section>
</html>
