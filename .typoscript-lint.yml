---
# TypoScript and TSconfig only (the site set directory also holds YAML)
filePatterns:
  - '*.typoscript'
  - '*.tsconfig'
sniffs:
  - class: Indentation
    parameters:
      indentConditions: true
      indentPerLevel: 2
      useSpaces: true
  - class: DeadCode
  - class: OperatorWhitespace
  - class: RepeatingRValue
    disabled: true
  - class: DuplicateAssignment
  - class: EmptySection
    disabled: true
  - class: NestingConsistency
    parameters:
      commonPathPrefixThreshold: 1
